<mat-card class="container-bg">
  <h1 class="titulo">Caja</h1>

  <!-- BUSCADOR -->
  <div style="display: flex; justify-content: flex-start; margin-bottom: 12px;">
    <mat-form-field appearance="outline" style="width: 250px;">
      <mat-label>Buscar pedido</mat-label>
      <input matInput [(ngModel)]="filtro" placeholder="Ingrese cliente o código">
    </mat-form-field>
  </div>

  <div class="text-end mb-2">
    <button mat-stroked-button color="primary">
      <mat-icon>filter_alt</mat-icon>
      Filtrar
    </button>
  </div>


  <!-- clasificar pedidos -->
  <mat-tab-group [(selectedIndex)]="tabIndex" class="tabs">
    <mat-tab label="Pendientes"></mat-tab>
    <mat-tab label="Pagados"></mat-tab>
    <mat-tab label="Cancelados"></mat-tab>
    <mat-tab label="Todos"></mat-tab>
  </mat-tab-group>


  <div class="mt-4">
    <h2 *ngIf="tabIndex === 0" class="subtitulo">Pedidos Pendientes de Pago</h2>
    <p class="text-muted" *ngIf="tabIndex === 0">Gestione los pagos de los pedidos realizados en tienda</p>

    <mat-card *ngFor="let pedido of pedidosPendientes" class="pedido-card">
      <!-- Itera sobre los pedidos filtrados según el texto de búsqueda y el tab seleccionado. -->

      <mat-card-content class="d-flex justify-content-between align-items-center flex-wrap">
        <div>
          <h3 class="codigo">{{ pedido.id }}</h3>
          <p class="cliente">{{ pedido.clienteName }}</p>

      <!-- Muestra el código del pedido, el nombre del cliente, y un chip que indica el estado con estilos diferentes. -->

          <mat-chip [ngClass]="{
              'chip-pendiente': pedido.status === 'PENDIENTE',
              'chip-pagado': pedido.status === 'Pagado',
              'chip-cancelado': pedido.status === 'Cancelado'
            }" selected>
            {{ pedido.status }}
          </mat-chip>
        </div>

        <div class="text-end">
          <h3 class="monto">${{ pedido.total.toFixed(2) }}</h3> 
          <p class="fecha">{{ pedido.fecha }} - {{ pedido.hora }}</p>

         

          <button *ngIf="pedido.estado === 'Pendiente'" mat-stroked-button class="btn-pagar me-2"
            (click)="pagarPedido(pedido)">
            Pagar
          </button>

          <button *ngIf="pedido.estado === 'Pendiente'" mat-stroked-button class="btn-cancelar me-2"
            (click)="cancelarPedido(pedido)">
            Cancelar
          </button>

          <button mat-raised-button class="btn-detalle me-2" (click)="abrirDialogo(pedido)">
            Ver Detalles
          </button>

          <button *ngIf="pedido.estado === 'Pagado'" mat-raised-button class="btn-boleta"
            (click)="imprimirBoleta(pedido)">
            Imprimir Boleta
          </button>
        </div>
      </mat-card-content>
    </mat-card>
  </div>
</mat-card>
