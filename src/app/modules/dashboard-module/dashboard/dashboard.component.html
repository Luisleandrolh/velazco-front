<div class="dashboard-wrapper">
  <h1 class="dashboard-title">Dashboard de Ventas</h1>

  <div class="actions">
    <button (click)="generateDailySalesPDF()">📄 Descargar PDF Diario</button>
  </div>

  <div class="card-grid">
    <!-- Gráfico de barras: Ventas por Día de la Semana -->
    <div class="card">
      <canvas
        baseChart
        [data]="salesByWeekdayChartData"
        [options]="salesByWeekdayChartOptions"
        chartType="bar">
      </canvas>
    </div>

    <!-- Gráfico de pie -->
    <div class="card">
      <h3>Top Productos</h3>
      <canvas baseChart [data]="productPieData" [options]="productPieOptions" chartType="pie"></canvas>
    </div>

    <!-- Gráfico semanal -->
    <div class="card">
      <canvas
        baseChart
        [data]="weeklyChartData"
        [options]="weeklyChartOptions"
        chartType="bar">
      </canvas>
    </div>

    <!-- Tabla resumen -->
    <div class="card table-card">
      <h3>Resumen de Productos Vendidos</h3>
      <table>
        <thead>
          <tr>
            <th>Producto</th>
            <th>Cantidad Vendida</th>
            <th>Total Ingresos (S/)</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let prod of resumenProductos">
            <td>{{ prod.productName }}</td>
            <td>{{ prod.totalQuantitySold }}</td>
            <td>{{ prod.totalRevenue | number: '1.2-2' }}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
